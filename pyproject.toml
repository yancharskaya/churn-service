[project]
name = "churn"
version = "0.1.0"
description = "Churn prediction service"
requires-python = ">=3.12"

# БАЗА: нужна и сервису, и обучению, и тестам
dependencies = [
    "joblib==1.5.3",
    "mlflow==3.14.0",
    "scikit-learn==1.9.0",
    "pandas==2.3.3",
]

[project.optional-dependencies]
api = [                       # только сервису
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "prometheus-fastapi-instrumentator==8.0.2",
]
train = [                     # только обучению и drift
    "dvc[s3]==3.67.1",
    "evidently==0.7.21",
]
dev = [                       # инструменты разработчика
    "pytest==9.1.1",
    "httpx==0.28.1",          # нужен TestClient
    "ruff==0.15.22",
    "pre-commit==4.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]              # искать пакеты в src/, найдёт churn

# --- бывший pytest.ini переезжает сюда ---
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: требует поднятого стека (docker compose up -d)",
]

# --- настройки линтера тоже здесь ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # ошибки, импорты, устаревшее, баги

[tool.ruff.lint.flake8-bugbear]
# Разрешаем вызов этих функций в аргументах по умолчанию
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]